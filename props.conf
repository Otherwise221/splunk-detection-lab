# Sourcetype for OTRF Security-Datasets (Windows event logs exported as JSON lines)
# Used for: empire_mimikatz_logonpasswords and other OTRF atomic Windows datasets

[otrf:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
TIMESTAMP_FIELDS = @timestamp
TZ = UTC
MAX_DAYS_AGO = 10951
